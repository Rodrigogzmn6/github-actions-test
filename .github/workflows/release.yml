name: Release on tag

on:
  push:
    tags:
      - 'v*' # When push a tag that starts with 'v'

permissions:
  contents: write # Write permissions to the repository

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
        
      - name : Build JAR
        run: mvn -B -DskipTests=false clean package
      
      - name: Create Github Release (with JAR)
        uses: softprops/action-gh-release@v2
        with:
          files: 'target/*.jar'
          title: 'Release ${{ github.ref_name }}'
          body: 'Successful release of ${{ github.ref_name }}'
          files: |
            target/*.jar
          draft: false
          prerelease: false