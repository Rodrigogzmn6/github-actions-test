# Pipeline name
name: CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        
      - name: Configure Java 26
        uses: actions/setup-java@v4
        with:
          java-version: 26
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and run tests
        run: mvn -B -DskipTests=false clean verify

